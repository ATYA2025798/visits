# النسخة الرسمية على Render: docs/deploy.md
# DEMO_PASSWORD (الاسم قديم من نسخة العرض) = كلمة السر الافتراضية لحسابات الفريق عند أول دخول.
# ⚠ قاعدة البيانات المجانية على Render بتنتهي بعد 30 يوم من إنشائها: لازم ترقيتها لخطة مدفوعة قبلها.
services:
  - type: web
    name: ambassadors-visits-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: visits-demo-db
          property: connectionString
      - key: DEMO_PASSWORD
        sync: false
      - key: MIKROTIK_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"

databases:
  - name: visits-demo-db
    plan: free
    region: frankfurt
    databaseName: visits
    user: visits
